<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso - SICOP Hub</title><style>body{font-family:Segoe UI,Arial;background:#f4f7fb;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:28px;border-radius:14px;width:min(360px,85vw);box-shadow:0 8px 30px #0002}.box input,.box button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ccd5df}.box button{background:#0b65c2;color:white;border:none;font-weight:600}.msg{background:#fdeaea;padding:10px;border-radius:7px}</style></head><body><form class="box" method="post"><h2>SICOP Opportunity Hub</h2><p>Acceso interno</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="msg">{{msg}}</div>{% endfor %}{% endwith %}<label>Correo</label><input type="email" name="email" required autocomplete="username"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"><button>Ingresar</button></form></body></html>
