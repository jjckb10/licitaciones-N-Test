<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SICOP Hub</title><style>body{font-family:Segoe UI,Arial;background:#f4f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:14px;width:min(360px,85vw);box-shadow:0 8px 30px #0002}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ccd5df}button{background:#0b65c2;color:#fff;border:0}.msg{background:#fdeaea;padding:10px}</style></head><body><form class="box" method="post"><h2>SICOP Opportunity Hub</h2><p>Acceso interno</p><input type="hidden" name="csrf_token" value="{{csrf_token}}">{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="msg">{{msg}}</div>{% endfor %}<label>Correo</label><input type="email" name="email" required><label>Contraseña</label><input type="password" name="password" required><button>Ingresar</button></form></body></html>
